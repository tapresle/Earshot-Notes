[package]
name = "earshot"
version = "0.1.0"
description = "Local-first meeting notes with on-device transcription and summaries"
edition = "2024"
license = "GPL-3.0-only"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "earshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/needle-sys", "crates/macos-audio"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
needle-sys = { path = "crates/needle-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
cpal = "0.18.2"
rubato = "5.0.1"
audioadapter-buffers = "5"
macos-audio = { version = "0.1.0", path = "crates/macos-audio" }
llama-cpp-2 = { version = "0.1.158", default-features = false, features = ["metal"] }
minijinja = { version = "2", features = ["loop_controls", "json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
sha2 = "0.11.0"
tauri-plugin-dialog = "2"
ureq = "3"
jiff = "0.2.37"

[dev-dependencies]
hound = "3"
tempfile = "3.27.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
