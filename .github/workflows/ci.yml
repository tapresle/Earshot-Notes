# Frontend checks and the license notices check. Both run on Linux: neither
# builds native code.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend lint, typecheck, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  notices:
    name: Third-party notices are current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_ABOUT_VERSION: 0.9.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      # The notices list license texts from node_modules.
      - run: npm ci
      - name: Cache cargo-about
        id: cargo-about
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-${{ runner.os }}-${{ env.CARGO_ABOUT_VERSION }}
      - name: Install cargo-about
        if: steps.cargo-about.outputs.cache-hit != 'true'
        run: cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
      - run: ./scripts/generate-notices.sh --check
