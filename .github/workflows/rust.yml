# Rust format, lint, and tests. These need macOS 26 on Apple Silicon: the
# prebuilt needle engine supports nothing else, and the build targets macOS 26.
# It takes several minutes, so it runs only when Rust or its inputs change.
name: Rust

on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/fetch-native.sh"
      - "scripts/build-whisper.sh"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/fetch-native.sh"
      - "scripts/build-whisper.sh"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust format, clippy, and tests
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the stable Rust toolchain
        id: toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          echo "rustc=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # Keyed on the pins in the scripts and the whisper.cpp interface, so a
      # change refetches or rebuilds. fetch-native.sh verifies every file's
      # checksum either way.
      - name: Cache native engines and models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src-tauri/vendor/needle/macos-arm64/libneedle.a
            src-tauri/vendor/whisper/macos-arm64
            src-tauri/resources/models/whistle.cact
            src-tauri/tests/models
          key: native-${{ hashFiles('scripts/fetch-native.sh', 'scripts/build-whisper.sh', 'src-tauri/crates/whisper-sys/native/**') }}
      - name: Fetch native engines and models, and build whisper.cpp
        run: ../scripts/fetch-native.sh
      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          # The build records absolute paths, which include the repository's
          # name, so a cache from before a rename can't be reused.
          key: cargo-macos-26-${{ github.event.repository.name }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-macos-26-${{ github.event.repository.name }}-${{ steps.toolchain.outputs.rustc }}-
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The hosted runner's virtual GPU runs the tiny test model in minutes; the CPU takes seconds.
      - run: cargo test --workspace
        env:
          EARSHOT_TEST_CPU: "1"
