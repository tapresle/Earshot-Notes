name: Feature request
description: Suggest something Earshot Notes could do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "**Never paste real meeting content here.** Use invented examples."
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How Earshot Notes could help. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
