# The website (#45): a static page in site/, served as is, with no build step.

[build]
  publish = "site"
  # Nothing to build. Netlify deploys the folder.
  command = ""
  # Skip the deploy, including pull request previews, when neither site/ nor
  # this file changed since the last build. Exit 0 skips; anything else builds.
  # Without a cache, CACHED_COMMIT_REF equals COMMIT_REF, so it always builds
  # then, and a failed comparison builds too.
  ignore = '[ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- site/ netlify.toml'

[[headers]]
  for = "/*"
  [headers.values]
    # Everything the page uses comes from this site: no scripts, fonts, or requests elsewhere.
    Content-Security-Policy = "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
